<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Sanitizer</title>
    <!-- Changed font to Poppins for a different visual identity -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* New Light Green Theme Variables */
        :root {
            --app-bg: #e8f5e9;
            /* Light mint green */
            --widget-bg: #ffffff;
            --text-main: #1b3320;
            --text-sub: #5b7562;
            --border-line: #c8e6c9;
            --brand-color: #2e7d32;
            /* Forest green */
            --brand-dark: #1b5e20;
            --brand-light: #f1f8e9;
            --state-success: #2e7d32;
            --state-error: #c62828;
            --shadow-soft: 0 10px 25px -5px rgba(46, 125, 50, 0.1);
        }

        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--app-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* Redesigned Container */
        .sanitizer-widget {
            background-color: var(--widget-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Distinct Header Style */
        .widget-topbar {
            background-color: var(--brand-light);
            padding: 30px 40px;
            text-align: center;
            border-bottom: 2px solid var(--border-line);
        }

        .widget-topbar h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--brand-dark);
            margin-bottom: 5px;
        }

        .widget-topbar p {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 300;
        }

        .widget-body {
            padding: 30px 40px 40px;
        }

        /* Refactored Drop Zone */
        .file-drop-region {
            border: 2px dashed var(--brand-color);
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            background-color: #fafafa;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease-in-out;
            margin-bottom: 20px;
        }

        .file-drop-region:hover,
        .file-drop-region.active-drag {
            background-color: var(--brand-light);
            border-color: var(--brand-dark);
            transform: scale(1.02);
        }

        /* New Security/Shield Icon */
        .doc-icon {
            width: 50px;
            height: 50px;
            color: var(--brand-color);
            margin: 0 auto 15px;
            display: block;
            transition: color 0.3s ease;
        }

        .file-drop-region:hover .doc-icon {
            color: var(--brand-dark);
        }

        .instruction-primary {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .instruction-secondary {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* Hidden standard input */
        .hidden-file-input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .selected-file-label {
            display: block;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--brand-dark);
            word-break: break-all;
        }

        /* Styled Button */
        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: linear-gradient(135deg, var(--brand-color), var(--brand-dark));
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }

        .action-button:hover {
            opacity: 0.9;
        }

        .action-button:active {
            transform: translateY(1px);
        }

        .action-button:disabled {
            background: #9e9e9e;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Distinct Loader */
        .loading-ring {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: #fff;
            animation: rotate 1s linear infinite;
        }

        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Feedback styling */
        .feedback-area {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 24px;
        }

        .msg-good {
            color: var(--state-success);
        }

        .msg-bad {
            color: var(--state-error);
        }
    </style>
</head>

<body>
    <div class="sanitizer-widget">
        <header class="widget-topbar">
            <h2>Data Masking Tool</h2>
            <p>Automatically detect and hide PII in your files</p>
        </header>

        <div class="widget-body">
            <form id="processor-form">
                <div class="file-drop-region" id="drag-container">
                    <!-- Shield Document Icon -->
                    <svg class="doc-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                        </path>
                    </svg>
                    <div class="instruction-primary">Browse or drop a file here</div>
                    <div class="instruction-secondary">Compatible formats: PDF, DOCX, TXT</div>
                    <input type="file" id="document-input" class="hidden-file-input" accept=".pdf, .txt, .docx"
                        required>
                    <span class="selected-file-label" id="file-label"></span>
                </div>

                <button type="submit" class="action-button" id="trigger-btn">
                    <span id="btn-label">Secure & Redact File</span>
                    <div class="loading-ring" id="loader"></div>
                </button>
            </form>

            <div id="system-feedback" class="feedback-area"></div>
        </div>
    </div>

    <script>
        // DOM Elements completely renamed
        const maskForm = document.getElementById('processor-form');
        const docInput = document.getElementById('document-input');
        const dragBox = document.getElementById('drag-container');
        const fileLabel = document.getElementById('file-label');
        const processBtn = document.getElementById('trigger-btn');
        const btnLabel = document.getElementById('btn-label');
        const loader = document.getElementById('loader');
        const sysFeedback = document.getElementById('system-feedback');

        // Handle File Choice
        const updateFileUI = (file) => {
            if (file) {
                fileLabel.textContent = file.name;
                sysFeedback.textContent = '';
                sysFeedback.className = 'feedback-area';
            } else {
                fileLabel.textContent = '';
            }
        };

        docInput.addEventListener('change', (event) => {
            updateFileUI(event.target.files[0]);
        });

        // Refactored Drag & Drop logic
        const stopDefaults = (e) => {
            e.preventDefault();
            e.stopPropagation();
        };

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dragBox.addEventListener(evt, stopDefaults);
        });

        const addHighlight = () => dragBox.classList.add('active-drag');
        const removeHighlight = () => dragBox.classList.remove('active-drag');

        ['dragenter', 'dragover'].forEach(evt => dragBox.addEventListener(evt, addHighlight));
        ['dragleave', 'drop'].forEach(evt => dragBox.addEventListener(evt, removeHighlight));

        dragBox.addEventListener('drop', (event) => {
            const droppedFiles = event.dataTransfer.files;
            if (droppedFiles.length) {
                docInput.files = droppedFiles;
                updateFileUI(droppedFiles[0]);
            }
        });

        // Refactored Submission & API handling
        maskForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const activeFile = docInput.files[0];
            if (!activeFile) return;

            // Toggle Loading UI
            processBtn.disabled = true;
            btnLabel.style.display = 'none';
            loader.style.display = 'block';
            sysFeedback.textContent = '';
            sysFeedback.className = 'feedback-area';

            const payload = new FormData();
            payload.append('file', activeFile);

            try {
                const apiResponse = await fetch('/api/redact', {
                    method: 'POST',
                    body: payload
                });

                if (!apiResponse.ok) {
                    const errorDetails = await apiResponse.json();
                    throw new Error(errorDetails.error || 'Server encountered an issue during redaction.');
                }

                // Process the downloaded blob
                const fileBlob = await apiResponse.blob();
                const tempUrl = URL.createObjectURL(fileBlob);

                // Parse filename safely
                const headerConfig = apiResponse.headers.get('Content-Disposition');
                let targetFilename = 'sanitized_output.docx';

                if (headerConfig && headerConfig.includes('filename=')) {
                    const nameParts = headerConfig.split('filename=');
                    if (nameParts.length > 1) {
                        targetFilename = nameParts[1].split(';')[0].replace(/['"]/g, '').trim();
                    }
                }

                // Trigger programmatic download
                const linkElement = document.createElement('a');
                linkElement.href = tempUrl;
                linkElement.download = targetFilename;
                document.body.appendChild(linkElement);
                linkElement.click();

                // Cleanup
                linkElement.remove();
                URL.revokeObjectURL(tempUrl);

                sysFeedback.textContent = 'Success! File sanitized and downloaded.';
                sysFeedback.className = 'feedback-area msg-good';

            } catch (err) {
                console.error('Redaction failed:', err);
                sysFeedback.textContent = err.message;
                sysFeedback.className = 'feedback-area msg-bad';
            } finally {
                // Restore Button UI
                processBtn.disabled = false;
                btnLabel.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>

</html>
